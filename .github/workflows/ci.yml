# Quality gates for every change headed to development or main.
#
# The same commands a developer runs locally (see CLAUDE.md, "Tooling gates")
# run here on a clean machine, so a green check means the change passes
# lint with zero warnings, type-checks, builds, and its unit tests pass.
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# The token can read the repository and nothing else. Jobs that need more
# must ask for it explicitly.
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint, type-check, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Reads the Node major from .nvmrc so CI and local machines agree.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile refuses to resolve anything the lockfile does not
      # already pin, so CI can never install something a developer did not.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs tsc before vite, so this is the type-check too.
      - name: Type-check and build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run src/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only what ships in the bundle. Dev tooling is audited by Dependabot.
      # Advisory until the dependency-update PR clears the current backlog
      # (73 advisories on 2026-09-11, all in build tooling): the step warns
      # instead of failing the job. Remove continue-on-error to make it block.
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
